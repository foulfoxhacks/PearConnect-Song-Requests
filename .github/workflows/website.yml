name: PearConnect website
on:
  push:
    branches: [main]
    paths: ['website/**', 'desktop/assets/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'desktop/assets/**', '.github/workflows/website.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: PearConnect-website
          path: website/dist/
          if-no-files-found: error
