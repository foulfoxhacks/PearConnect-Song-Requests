name: PearConnect CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm pkg set overrides.qs=6.16.0
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm audit --json > audit.json || true
      - run: cat audit.json
      - name: Export repaired dependency snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('dependencies.zip', 'w', ZIP_DEFLATED) as archive:
              for path in Path('node_modules').rglob('*'):
                  if path.is_file():
                      archive.write(path, str(path))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pearconnect-dependencies
          path: |
            package.json
            package-lock.json
            dependencies.zip
            audit.json
          retention-days: 3
          if-no-files-found: error
